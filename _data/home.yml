about_text: |-
  I'm Hiba BenK, a writer from Morocco. My work moves between global affairs and the intimate: how culture, identity and power travel through institutions, and through the women who carry them.

  Emily is the part of me that only speaks in poems. This is our shared home: a night garden of poems, essays and articles that we keep tending.
