  أنا هبة، كاتبة من المغرب. أكتب بين الشؤون الدولية والحميمي: كيف تنتقل الثقافة والهوية والسلطة عبر المؤسسات، وعبر النساء اللواتي يحملنها.

  إيميلي هي الجزء مني الذي لا يتكلم إلا شعراً. هذا بيتنا المشترك.
